<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 892" width="1000" height="892" role="img" aria-labelledby="arch-title arch-desc">
  <title id="arch-title">u7agent の構成 — エージェント本体（BFF + pi SDK）と実行ランタイム（サンドボックス）</title>
  <desc id="arch-desc">ブラウザから BFF の pi SDK が会話を進め、作業用ツールの実行だけを別プロセスのサンドボックスへ委譲する。LLM の API キーは BFF の中に残り、サンドボックスへ渡るのは共有トークンだけ。</desc>
  <defs>
    <style>
      svg {
        font-family: system-ui, -apple-system, "Segoe UI", "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic UI", Meiryo, sans-serif;
      }
      .bg { fill: #ffffff; }
      .card { fill: #ffffff; stroke: #e2e8f0; stroke-width: 1.5; }
      .subcard { fill: #f8fafc; stroke: #e2e8f0; stroke-width: 1.5; }
      .accent-card { fill: #f5f3ff; stroke: #ddd6fe; stroke-width: 1.5; }
      .ws { fill: #ecfdf5; stroke: #a7f3d0; stroke-width: 1.5; }
      .note { fill: #fffbeb; stroke: #fcd34d; stroke-width: 1.5; }
      .chip { fill: #f1f5f9; stroke: #cbd5e1; stroke-width: 1.5; }
      .bar-blue { fill: #0284c7; }
      .bar-violet { fill: #7c3aed; }
      .bar-green { fill: #059669; }
      .line { fill: none; stroke: #94a3b8; stroke-width: 2; }
      .head { fill: #94a3b8; }
      .t-title { font-size: 25px; font-weight: 700; fill: #0f172a; }
      .t-sub { font-size: 14px; fill: #64748b; }
      .t-head { font-size: 16.5px; font-weight: 700; fill: #0f172a; }
      .t-sub-mut { font-size: 13px; fill: #64748b; }
      .t-body { font-size: 13.5px; fill: #334155; }
      .t-item { font-size: 12.5px; fill: #334155; }
      .t-small { font-size: 12.5px; fill: #64748b; }
      .t-item-title { font-size: 13.5px; font-weight: 700; fill: #6d28d9; }
      .t-item-head { font-size: 13.5px; font-weight: 700; fill: #0f172a; }
      .t-note { font-size: 13.5px; fill: #92400e; }
      .t-chip { font-size: 12.5px; fill: #334155; }
      .t-ws { font-size: 13px; font-weight: 700; fill: #047857; }
      .t-ws-sub { font-size: 11.5px; fill: #047857; }
      @media (prefers-color-scheme: dark) {
        .bg { fill: #0d1117; }
        .card { fill: #161b22; stroke: #30363d; }
        .subcard { fill: #1a1f27; stroke: #30363d; }
        .accent-card { fill: #241c45; stroke: #463a7a; }
        .ws { fill: #0c2f24; stroke: #1e5643; }
        .note { fill: #362809; stroke: #6a520f; }
        .chip { fill: #1c2129; stroke: #3a424d; }
        .bar-blue { fill: #38bdf8; }
        .bar-violet { fill: #a78bfa; }
        .bar-green { fill: #34d399; }
        .line { stroke: #7d8590; }
        .head { fill: #7d8590; }
        .t-title { fill: #f0f6fc; }
        .t-sub { fill: #8b949e; }
        .t-head { fill: #f0f6fc; }
        .t-sub-mut { fill: #8b949e; }
        .t-body { fill: #c9d1d9; }
        .t-item { fill: #c9d1d9; }
        .t-small { fill: #8b949e; }
        .t-item-title { fill: #c4b5fd; }
        .t-item-head { fill: #f0f6fc; }
        .t-note { fill: #fcd34d; }
        .t-chip { fill: #c9d1d9; }
        .t-ws { fill: #6ee7b7; }
        .t-ws-sub { fill: #6ee7b7; }
      }
    </style>
    <marker id="arrowEnd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto">
      <path class="head" d="M0,0 L10,5 L0,10 z" />
    </marker>
    <marker id="arrowStart" viewBox="0 0 10 10" refX="0" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto">
      <path class="head" d="M10,0 L0,5 L10,10 z" />
    </marker>
  </defs>

  <rect class="bg" width="1000" height="892" />

  <!-- ヘッダー -->
  <text class="t-title" x="56" y="54">u7agent — エージェント本体と実行ランタイム</text>
  <text class="t-sub" x="56" y="84">「考える」BFF（pi SDK）と「実行する」サンドボックスを分離し、LLM の認証情報を作業環境へ渡さない</text>

  <!-- ブラウザ -->
  <rect class="card" x="56" y="110" width="888" height="104" rx="14" />
  <rect class="bar-blue" x="56" y="110" width="5" height="104" rx="2.5" />
  <text class="t-head" x="86" y="144">ブラウザ — Vite + React の GUI</text>
  <text class="t-sub-mut" x="86" y="171">チャット / 設定 / ファイル閲覧。実行そのものはサーバー側が持ち、タブを閉じても止まらない。</text>
  <text class="t-sub-mut" x="86" y="196">POST /api/sessions/:id/messages → 202（即返却）／ GET /api/sessions/:id/events（SSE）で購読・リプレイ</text>

  <!-- ブラウザ ⇄ BFF -->
  <line class="line" x1="500" y1="218" x2="500" y2="284" marker-start="url(#arrowStart)" marker-end="url(#arrowEnd)" />
  <text class="t-small" x="516" y="255">HTTP ／ SSE（双方向）</text>

  <!-- エージェント本体 -->
  <rect class="card" x="56" y="290" width="888" height="252" rx="14" />
  <rect class="bar-violet" x="56" y="290" width="5" height="252" rx="2.5" />
  <text class="t-head" x="86" y="323">エージェント本体 — BFF（Hono）+ pi SDK</text>
  <text class="t-sub-mut" x="86" y="349">作業用ツールは「サンドボックス API を呼ぶリモート定義」に置き換え、BFF では作業コードを実行しない</text>

  <rect class="accent-card" x="84" y="368" width="284" height="102" rx="10" />
  <text class="t-item-title" x="104" y="394">pi SDK — 会話ランタイム</text>
  <text class="t-item" x="104" y="418">モデルを呼び、会話ループを回す</text>
  <text class="t-item" x="104" y="439">ツール実行をサンドボックスへ中継</text>
  <text class="t-item" x="104" y="460">SDK イベントを SSE 用に変換</text>

  <rect class="subcard" x="384" y="368" width="248" height="102" rx="10" />
  <text class="t-item-head" x="404" y="394">SessionStore — 実行の管理</text>
  <text class="t-item" x="404" y="418">ラン / キュー / 購読を一元管理</text>
  <text class="t-item" x="404" y="439">ブラウザ切断でも実行は継続</text>
  <text class="t-item" x="404" y="460">停止は POST /stop のときだけ</text>

  <rect class="subcard" x="648" y="368" width="268" height="102" rx="10" />
  <text class="t-item-head" x="668" y="394">永続化 — 会話ストア + アプリ DB</text>
  <text class="t-item" x="668" y="418">会話履歴は会話ストアへ保存</text>
  <text class="t-item" x="668" y="439">設定と API キーは SQLite へ保存</text>
  <text class="t-item" x="668" y="460">再起動後も一覧・履歴を復元</text>

  <rect class="note" x="84" y="484" width="832" height="44" rx="10" />
  <text class="t-note" x="104" y="511">秘密情報の境界： LLM の API キーとモデル設定は BFF の中だけ。サンドボックスへ渡すのは共有トークンだけ。</text>

  <!-- BFF → サンドボックス -->
  <line class="line" x1="500" y1="548" x2="500" y2="660" marker-end="url(#arrowEnd)" />
  <text class="t-body" x="524" y="576">BFF → サンドボックス：ツール実行の要求（JSON）</text>
  <text class="t-body" x="524" y="598">サンドボックス → BFF：update / result / error（NDJSON）</text>
  <text class="t-small" x="524" y="622">内部ネットワークのみ・Bearer 認証／ホストへ公開しない</text>

  <!-- 実行ランタイム -->
  <rect class="card" x="56" y="668" width="888" height="150" rx="14" />
  <rect class="bar-green" x="56" y="668" width="5" height="150" rx="2.5" />
  <text class="t-head" x="86" y="701">実行ランタイム — サンドボックス（別プロセス）</text>
  <text class="t-sub-mut" x="86" y="727">pi SDK の組み込みツールを、実ファイルシステムに対してそのまま実行する唯一の場所</text>

  <rect class="chip" x="84" y="741" width="66" height="28" rx="8" />
  <text class="t-chip" x="117" y="760" text-anchor="middle">read</text>
  <rect class="chip" x="158" y="741" width="66" height="28" rx="8" />
  <text class="t-chip" x="191" y="760" text-anchor="middle">bash</text>
  <rect class="chip" x="232" y="741" width="66" height="28" rx="8" />
  <text class="t-chip" x="265" y="760" text-anchor="middle">edit</text>
  <rect class="chip" x="306" y="741" width="66" height="28" rx="8" />
  <text class="t-chip" x="339" y="760" text-anchor="middle">write</text>
  <rect class="chip" x="380" y="741" width="66" height="28" rx="8" />
  <text class="t-chip" x="413" y="760" text-anchor="middle">grep</text>
  <rect class="chip" x="454" y="741" width="66" height="28" rx="8" />
  <text class="t-chip" x="487" y="760" text-anchor="middle">find</text>
  <rect class="chip" x="528" y="741" width="66" height="28" rx="8" />
  <text class="t-chip" x="561" y="760" text-anchor="middle">ls</text>

  <rect class="ws" x="622" y="741" width="294" height="54" rx="10" />
  <text class="t-ws" x="642" y="763">ワークスペース（永続ボリューム）</text>
  <text class="t-ws-sub" x="642" y="783">ここだけにマウント／パスは root 相対</text>

  <text class="t-small" x="86" y="800">ファイル一覧・プレビュー・ダウンロード（ZIP）もサンドボックスの API が返す</text>

  <!-- 脚注 -->
  <text class="t-small" x="56" y="850">BFF とサンドボックスは同じ配布イメージを使い、起動コマンドだけを差し替える（例：node --import tsx src/sandbox/index.ts）</text>
  <text class="t-small" x="56" y="872">ポートやマウント先などの具体的な値は、デプロイ環境の設定で決まる。</text>
</svg>
