services:
  u7agent-relay:
    build: .
    # u7agent の BFF は認証を持たないため、中継を LAN 全体へ晒さない。ホストの loopback だけに公開し、
    # 別端末から使うときは Tailscale などで到達範囲を絞る。
    ports:
      - "127.0.0.1:8787:8787"
    environment:
      DATA_DIR: /app/data
    volumes:
      - u7agent_relay_data:/app/data
    restart: unless-stopped

volumes:
  u7agent_relay_data:
