<!-- Portal logo: an arched doorway with light spilling through it (original artwork). -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Portal">
  <defs>
    <linearGradient id="pl-tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8280ff" />
      <stop offset="1" stop-color="#4340cf" />
    </linearGradient>
    <radialGradient id="pl-sheen" cx="18" cy="8" r="46" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.28" />
      <stop offset="1" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="pl-frame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" />
      <stop offset="1" stop-color="#dcdbff" />
    </linearGradient>
    <linearGradient id="pl-door" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#27248f" />
      <stop offset="1" stop-color="#5855e6" />
    </linearGradient>
    <radialGradient id="pl-glow" cx="32" cy="52" r="13" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="0.55" stop-color="#c9c8ff" stop-opacity="0.45" />
      <stop offset="1" stop-color="#c9c8ff" stop-opacity="0" />
    </radialGradient>
    <clipPath id="pl-tile-clip">
      <rect width="64" height="64" rx="14.4" />
    </clipPath>
    <clipPath id="pl-door-clip">
      <path d="M24.5 52V27.5a7.5 7.5 0 0 1 15 0V52Z" />
    </clipPath>
  </defs>
  <g clip-path="url(#pl-tile-clip)">
    <rect width="64" height="64" fill="url(#pl-tile)" />
    <rect width="64" height="64" fill="url(#pl-sheen)" />
  </g>
  <path d="M17 52V27a15 15 0 0 1 30 0v25Z" fill="url(#pl-frame)" />
  <path d="M24.5 52V27.5a7.5 7.5 0 0 1 15 0V52Z" fill="url(#pl-door)" />
  <g clip-path="url(#pl-door-clip)">
    <ellipse cx="32" cy="52" rx="13" ry="14" fill="url(#pl-glow)" />
  </g>
</svg>
