<!-- Portal logo: a mascot sitting on a stack of shipping containers (original artwork). -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Portal">
  <defs>
    <linearGradient id="pl-tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16233d" />
      <stop offset="1" stop-color="#080f1e" />
    </linearGradient>
    <radialGradient id="pl-halo" cx="32" cy="30" r="34" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.3" />
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="pl-mascot" x1="0" y1="0" x2="0" y2="1">
