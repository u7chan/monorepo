      <stop offset="1" stop-color="#bae6fd" />
    </linearGradient>
    <linearGradient id="pl-container" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#67e8f9" />
      <stop offset="1" stop-color="#0891b2" />
    </linearGradient>
    <clipPath id="pl-clip">
      <rect width="64" height="64" rx="14" />
    </clipPath>
  </defs>
  <g clip-path="url(#pl-clip)">
    <rect width="64" height="64" rx="14" fill="url(#pl-tile)" />
    <circle cx="32" cy="30" r="34" fill="url(#pl-halo)" />
  </g>
