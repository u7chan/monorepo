version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 1
    rebase-strategy: "disabled"
    labels:
      - "dependabot-auto-process"
    groups:
      actions-minor-and-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "bun"
    directory: "/projects/aiagent"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 1
    rebase-strategy: "disabled"
    labels:
      - "dependabot-auto-process"
    # pi SDK は 0.x の minor でも破壊変更が入るため、u7agent / usage-portal と同じく
    # migration とセットの専用 PR で手動更新する（aiagent は 0.84 系）
    ignore:
      - dependency-name: "@earendil-works/pi-*"
    groups:
      aiagent-minor-and-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "bun"
    directory: "/projects/file-server"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 1
    rebase-strategy: "disabled"
    labels:
      - "dependabot-auto-process"
    groups:
      file-server-minor-and-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "npm"
    directory: "/projects/u7agent"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 1
    rebase-strategy: "disabled"
    labels:
      - "dependabot-auto-process"
    # pi SDK は 0.x の minor でも破壊変更が入る（0.99.0 で画像モデル API が削除された）ため、
    # ルーチンの更新には混ぜず migration とセットの専用 PR で手動更新する
    ignore:
      - dependency-name: "@earendil-works/pi-*"
    groups:
      u7agent-minor-and-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # ベースイメージの更新。lockfile を持たないので npm のエントリとは分ける。
  # Dockerfile が版 + digest で固定しているため、パッチ版と digest の更新 PR はここで受ける。
  - package-ecosystem: "docker"
    directory: "/projects/u7agent"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 1
    rebase-strategy: "disabled"
    labels:
      - "dependabot-auto-process"
    groups:
      u7agent-docker-minor-and-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "bun"
    directory: "/projects/portal"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 1
    rebase-strategy: "disabled"
    labels:
      - "dependabot-auto-process"
    groups:
      portal-minor-and-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # ベースイメージの更新。lockfile を持たないので bun のエントリとは分ける。
  # Dockerfile が版 + digest で固定しているため、パッチ版と digest の更新 PR はここで受ける。
  - package-ecosystem: "docker"
    directory: "/projects/portal"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 1
    rebase-strategy: "disabled"
    labels:
      - "dependabot-auto-process"
    groups:
      portal-docker-minor-and-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "bun"
    directory: "/projects/portfolio"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 1
    rebase-strategy: "disabled"
    labels:
      - "dependabot-auto-process"
    groups:
      portfolio-minor-and-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # ベースイメージの更新。lockfile を持たないので bun のエントリとは分ける。
  # Dockerfile が版 + digest で固定しているため、パッチ版と digest の更新 PR はここで受ける。
  - package-ecosystem: "docker"
    directory: "/projects/portfolio"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 1
    rebase-strategy: "disabled"
    labels:
      - "dependabot-auto-process"
    groups:
      portfolio-docker-minor-and-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "bun"
    directory: "/projects/usage-portal"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 1
    rebase-strategy: "disabled"
    labels:
      - "dependabot-auto-process"
    # pi SDK は 0.x の minor でも破壊変更が入るため、u7agent と同じくルーチンの更新には混ぜず、
    # migration とセットの専用 PR で手動更新する（Portal は 3 番目の PR で Pi SDK を入れる）
    ignore:
      - dependency-name: "@earendil-works/pi-*"
    groups:
      usage-portal-minor-and-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
