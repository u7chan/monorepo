version: 2
updates:
  - package-ecosystem: "bun"
    directory: "/projects/browser-auto"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 1
    rebase-strategy: "disabled"
    labels:
      - "dependabot-auto-process"
    groups:
      browser-auto-minor-and-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "uv"
    directory: "/projects/edit-vid"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 1
    rebase-strategy: "disabled"
    labels:
      - "dependabot-auto-process"
    groups:
      edit-vid-minor-and-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "bun"
    directory: "/projects/edit-vid2"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 1
    rebase-strategy: "disabled"
    labels:
      - "dependabot-auto-process"
    groups:
      edit-vid2-minor-and-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "bun"
    directory: "/projects/file-server"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 1
    rebase-strategy: "disabled"
    labels:
      - "dependabot-auto-process"
    groups:
      file-server-minor-and-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "npm"
    directory: "/projects/u7agent"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 1
    rebase-strategy: "disabled"
    labels:
      - "dependabot-auto-process"
    # pi SDK は 0.x の minor でも破壊変更が入る（0.99.0 で画像モデル API が削除された）ため、
    # ルーチンの更新には混ぜず migration とセットの専用 PR で手動更新する
    ignore:
      - dependency-name: "@earendil-works/pi-*"
    groups:
      u7agent-minor-and-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "bun"
    directory: "/projects/portal"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 1
    rebase-strategy: "disabled"
    labels:
      - "dependabot-auto-process"
    groups:
      portal-minor-and-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "bun"
    directory: "/projects/portfolio"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 1
    rebase-strategy: "disabled"
    labels:
      - "dependabot-auto-process"
    groups:
      portfolio-minor-and-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "uv"
    directory: "/projects/simple-agent-poc"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 1
    rebase-strategy: "disabled"
    labels:
      - "dependabot-auto-process"
    # pyproject.toml の litellm 上限（<1.103）を緩めてまで更新させない
    ignore:
      - dependency-name: "litellm"
        versions:
          - ">=1.103.0"
    groups:
      simple-agent-poc-minor-and-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
