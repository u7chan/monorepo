name: Cleanup Docker Images
description: Trigger repository dispatch to clean up old monorepo Docker images

inputs:
  token:
    description: "GitHub token for repository dispatch"
    required: true
  repo-name:
    description: "Target repository name for cleanup"
    required: true
  project-names-csv:
    description: "Comma separated project names used to build monorepo image paths"
    required: true

runs:
  using: composite
  steps:
    - name: Trigger Cleanup Workflow
      shell: bash
      run: |
        ${{ github.action_path }}/cleanup-docker-images.sh \
          "${{ inputs.token }}" \
          "${{ inputs.repo-name }}" \
          "${{ inputs.project-names-csv }}"
