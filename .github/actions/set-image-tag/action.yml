name: Set Image Tag
description: Determine Docker image tag for push and manual builds

inputs:
  event_name:
    description: "GitHub event name"
    required: true
  ref_input:
    description: "workflow_dispatch ref input"
    required: false
    default: ""

outputs:
  image_tag:
    description: "Primary Docker image tag (used for the deploy handoff)"
    value: ${{ steps.set-image-tag.outputs.image_tag }}
  image_tags:
    description: "Space separated Docker image tags to build and push"
    value: ${{ steps.set-image-tag.outputs.image_tags }}
  commit_sha:
    description: "Full commit SHA of the built source"
    value: ${{ steps.set-image-tag.outputs.commit_sha }}

runs:
  using: composite
  steps:
    - name: Set Image Tag
      id: set-image-tag
      shell: bash
      run: |
        ${{ github.action_path }}/set-image-tag.sh "${{ inputs.event_name }}" "${{ inputs.ref_input }}"
