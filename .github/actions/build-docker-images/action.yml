name: Build Docker Images
description: Build Docker images for projects with Dockerfile

inputs:
  stage:
    description: "Docker build arguments --target option"
    required: true
  image_tags:
    description: "Space separated Docker image tags"
    required: false
    default: "latest"

runs:
  using: composite
  steps:
    - name: Build Docker Images
      shell: bash
      run: |
        # 共通スクリプトを実行
        ${{ github.action_path }}/build-docker-images.sh "${{ inputs.stage }}" "${{ inputs.image_tags }}"
