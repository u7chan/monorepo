# Docker Build on Project Changes
name: CD

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref (branch/tag/SHA)"
        required: true
      projects:
        description: "Comma separated project directories"
        required: true

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  queue: max
  cancel-in-progress: false

jobs:
  docker-build-if-changes-detected:
    # Dockerコマンドを使用するため、ubuntu-slimでは利用できない
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          # 自動CDは push の SHA に固定せず、ジョブ開始時点の最新 main からビルドする
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.ref || github.ref }}
          persist-credentials: false
          # push の before〜after の差分と、ビルドするソースの履歴を扱う
          fetch-depth: 0

      - name: Show build source
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SHA: ${{ github.sha }}
        run: |
          echo "event_name=$EVENT_NAME"
          echo "event_sha=$EVENT_SHA"
          echo "build_source_sha=$(git rev-parse HEAD)"
          git log -1 --format='build_source_commit=%H %s'

      - name: Get Changed Directories
        if: github.event_name == 'push'
        uses: ./.github/actions/get-changed-directories
        with:
          # ビルドするソースは最新 main だが、変更検出はこの push 自身の差分で行う
          old-ref: ${{ github.event.before }}
          new-ref: ${{ github.event.after }}

      - name: Get Changed Projects
        if: github.event_name == 'push'
        uses: ./.github/actions/get-changed-projects
        with:
          required-stage: final

      - name: Prepare manual build inputs
        if: github.event_name == 'workflow_dispatch'
        uses: ./.github/actions/prepare-manual-build-inputs
        with:
          projects: ${{ github.event.inputs.projects }}

      - name: Set image tag
        id: set-image-tag
        uses: ./.github/actions/set-image-tag
        with:
          event_name: ${{ github.event_name }}
          ref_input: ${{ github.event.inputs.ref }}

      - name: Build Docker Images
        if: env.BUILD_PROJECT != ''
        uses: ./.github/actions/build-docker-images
        with:
          stage: final
          image_tags: ${{ steps.set-image-tag.outputs.image_tags }}

      - name: Show Docker Images
        if: env.BUILD_PROJECT != ''
        run: |
          docker images

      - name: Push Docker Images
        if: env.BUILD_PROJECT != ''
        id: push_images
        uses: ./.github/actions/push-docker-images
        with:
          username: ${{ github.actor }}
          password: ${{ secrets.PRIVATE_REPO_TOKEN }}
          image_tags: ${{ steps.set-image-tag.outputs.image_tags }}

      - name: Show pushed images
        if: steps.push_images.outputs.project_names_csv != ''
        env:
          PROJECT_NAMES_CSV: ${{ steps.push_images.outputs.project_names_csv }}
          IMAGE_TAGS: ${{ steps.set-image-tag.outputs.image_tags }}
          COMMIT_SHA: ${{ steps.set-image-tag.outputs.commit_sha }}
        run: |
          echo "Build summary"
          echo "commit_sha=$COMMIT_SHA"
          echo "image_tags=$IMAGE_TAGS"
          IFS=',' read -ra PROJECT_NAMES <<< "$PROJECT_NAMES_CSV"
          for project_name in "${PROJECT_NAMES[@]}"; do
            for image_tag in $IMAGE_TAGS; do
              echo "pushed_image=ghcr.io/$GITHUB_REPOSITORY/$project_name:$image_tag"
            done
          done

      - name: Show manual deploy inputs
        if: github.event_name == 'workflow_dispatch' && steps.push_images.outputs.project_names_csv != ''
        env:
          PROJECT_NAMES_CSV: ${{ steps.push_images.outputs.project_names_csv }}
          IMAGE_TAG: ${{ steps.set-image-tag.outputs.image_tag }}
        run: |
          echo "Manual build handoff"
          echo "image_tag=$IMAGE_TAG"
          echo ""
          IFS=',' read -ra PROJECT_NAMES <<< "$PROJECT_NAMES_CSV"
          for project_name in "${PROJECT_NAMES[@]}"; do
            echo "image_path=monorepo/$project_name image_tag=$IMAGE_TAG"
          done

      - name: Clean Up Docker Images
        if: steps.push_images.outputs.project_names_csv != ''
        uses: ./.github/actions/cleanup-docker-images
        with:
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          repo-name: ${{ secrets.PRIVATE_REPO_NAME }}
          project-names-csv: ${{ steps.push_images.outputs.project_names_csv }}
          keep-count: "3"
          cleanup-mode: ${{ github.event_name == 'workflow_dispatch' && 'manual' || 'normal' }}
